<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.webmanifest"><title>司法書士 過去問トレーニング</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#17324d;color:white;padding:18px 16px}header h1{font-size:19px;margin:0 0 4px}header p{font-size:12px;margin:0;opacity:.8}.wrap{max-width:760px;margin:auto;padding:14px}.panel{background:white;border:1px solid #dce2e8;border-radius:14px;padding:14px;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}select,button{font:inherit;border:1px solid #cbd5df;border-radius:9px;padding:11px;background:white;color:#17212b}button.primary{background:#17324d;color:white;border-color:#17324d}button:disabled{opacity:.4}select{flex:1;min-width:130px}.muted{color:#637181;font-size:12px}.qtext{white-space:pre-wrap;line-height:1.75;font-size:14px;overflow-wrap:anywhere}.answer{background:#eef5fb;border-radius:10px;padding:12px;margin-top:12px}.pill{display:inline-block;background:#e8edf2;border-radius:99px;padding:3px 8px;font-size:11px;margin-right:5px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.nav button{flex:1}.notice{font-size:12px;color:#6b4b18;background:#fff7e6;padding:10px;border-radius:9px}.hidden{display:none}</style></head><body><header><h1>司法書士 過去問トレーニング</h1><p>年度追加型データベース / 個人学習用</p></header><main class="wrap"><section class="panel"><div class="row"><select id="year"><option>年度を読み込み中…</option></select><select id="session"><option value="AM">午前</option><option value="PM">午後</option></select><select id="kind"><option value="all">全形式</option><option value="択一">択一</option><option value="記述式">記述式</option></select></div><div class="row" style="margin-top:9px"><select id="subject"><option value="all">全科目</option></select><select id="order"><option value="seq">問題順</option><option value="random">ランダム</option></select><button class="primary" id="load">表示</button></div><p id="status" class="muted">公開リポジトリの年度データを検索します。</p></section><section id="question" class="panel hidden"><div id="meta"></div><h2 id="title" style="font-size:17px;line-height:1.5"></h2><div id="body" class="qtext"></div><div id="answer" class="answer hidden"></div><div class="row" style="margin-top:12px"><button id="reveal" class="primary">予備校解答を表示</button></div><div class="nav"><button id="prev">前の問題</button><button id="next" class="primary">次の問題</button></div></section><section class="panel"><div class="notice">解答番号はユーザー提供の予備校解答です。公式解答との照合および各肢の法的正誤・根拠確認は未完了です。自動抽出した肢候補も原本照合前です。</div></section><footer class="muted" style="text-align:center;padding:12px">v001 · データ追加時は data/Rxx/ フォルダを追加</footer></main><script>
const $=id=>document.getElementById(id);let datasets=[],rows=[],baseRows=[],idx=0,answers={};let repo=null;
function repoFromLocation(){const host=location.hostname.split('.');const owner=host[0];const path=location.pathname.split('/').filter(Boolean);if(!owner||owner==='localhost'||host.length<3)return null;return {owner,repo:path[0]||owner};}
async function api(path){const r=await fetch('https://api.github.com/repos/'+repo.owner+'/'+repo.repo+'/contents/'+path,{headers:{'Accept':'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub API '+r.status+' '+path);return r.json()}
async function raw(path){const u='https://raw.githubusercontent.com/'+repo.owner+'/'+repo.repo+'/main/'+path;const r=await fetch(u);if(!r.ok)throw Error('データ取得失敗 '+path);return r.text()}
function csv(s){const out=[];let row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q&&c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x!==''))out.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x!==''))out.push(row);return out.slice(1).map(a=>Object.fromEntries(out[0].map((k,i)=>[k,a[i]??''])))}
async function init(){repo=repoFromLocation();if(!repo){$('status').textContent='GitHub Pages上で開くと年度データを自動取得します。';return}try{const dirs=await api('data');datasets=[];for(const d of dirs.filter(x=>x.type==='dir'&&/^R\d{2}$/.test(x.name))){try{const m=JSON.parse(await raw('data/'+d.name+'/manifest.json'));datasets.push({id:d.name,manifest:m})}catch(e){console.warn(e)}}datasets.sort((a,b)=>b.manifest.year-a.manifest.year);$('year').innerHTML=datasets.map(x=>`<option value="${x.id}">${x.manifest.display_name}</option>`).join('')||'<option>年度データなし</option>';$('status').textContent=datasets.length+'年度を検出しました。';if(datasets.length)await loadData()}catch(e){$('status').textContent='年度一覧を取得できません：'+e.message+'（公開リポジトリか確認してください）'}}
async function loadData(){const id=$('year').value,d=datasets.find(x=>x.id===id);if(!d)return;const s=$('session').value,k=$('kind').value;let fileRows=[];if(s==='AM'){fileRows=csv(await raw('data/'+id+'/AM_questions.csv'));}else if(k==='記述式'){fileRows=csv(await raw('data/'+id+'/PM_written.csv'));}else if(k==='択一'){fileRows=csv(await raw('data/'+id+'/PM_multiple_choice.csv'));}else{const a=csv(await raw('data/'+id+'/PM_multiple_choice.csv'));const b=csv(await raw('data/'+id+'/PM_written.csv'));fileRows=a.concat(b);}baseRows=fileRows;const subs=[...new Set(baseRows.map(x=>x.subject))];$('subject').innerHTML='<option value="all">全科目</option>'+subs.map(x=>`<option>${x}</option>`).join('');applyFilters();}
function applyFilters(){rows=baseRows.slice();const sub=$('subject').value;if(sub!=='all')rows=rows.filter(x=>x.subject===sub);if($('order').value==='random')rows.sort(()=>Math.random()-.5);else rows.sort((a,b)=>+a.question_no-+b.question_no);idx=0;render()}
function render(){if(!rows.length){$('question').classList.add('hidden');$('status').textContent='該当する問題がありません。';return}$('question').classList.remove('hidden');const q=rows[idx];$('meta').innerHTML=`<span class="pill">${q.subject}</span><span class="pill">${q.exam_session==='AM'?'午前':'午後'}</span><span class="pill">${q.question_type||q.question_format}</span><span class="muted">${idx+1}/${rows.length}</span>`;$('title').textContent=q.title||`第${q.question_no}問`;$('body').textContent=q.extracted_text||'';$('answer').classList.add('hidden');$('answer').textContent='';$('reveal').textContent='予備校解答を表示';$('prev').disabled=idx===0;$('next').disabled=idx===rows.length-1}
async function reveal(){const q=rows[idx];if(!answers[q.question_id]){try{const d=datasets.find(x=>x.id===$('year').value);answers=Object.assign(answers,Object.fromEntries(csv(await raw('data/'+d.id+'/answer_key.csv')).map(x=>[x.question_id,x.answer_choice_prep_school])))}catch(e){}}$('answer').textContent=answers[q.question_id]?'予備校解答番号：'+answers[q.question_id]+'（公式解答未照合）':'解答データがありません';$('answer').classList.remove('hidden');$('reveal').textContent='解答を表示中'}
$('load').onclick=()=>loadData().then(applyFilters).catch(e=>$('status').textContent=e.message);$('year').onchange=loadData;$('session').onchange=loadData;$('kind').onchange=loadData;$('subject').onchange=applyFilters;$('order').onchange=applyFilters;$('reveal').onclick=reveal;$('prev').onclick=()=>{idx--;render()};$('next').onclick=()=>{idx++;render()};init();
</script><script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script></body></html>
